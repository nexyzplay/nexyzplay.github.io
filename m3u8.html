<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>M3U8 Player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  /* Sembunyikan overlay saat fullscreen agar tidak menutupi UI sistem */
  :fullscreen #msg, :-webkit-full-screen #msg { display: none !important; }
  #msg {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    max-width: 90%; padding: 8px 14px; border-radius: 6px;
    background: rgba(0,0,0,.75); color: #fff; font: 14px system-ui, sans-serif;
    text-align: center; display: none; z-index: 10;
  }
</style>
</head>
<body>
<video id="video" controls autoplay playsinline
       referrerpolicy="no-referrer"
       disablepictureinpicture
       controlslist="nodownload noplaybackrate"></video>
<div id="msg" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  const m = location.search.match(/[?&]url=(.*)$/);
  let SRC = m ? m[1] : "";
  if (/^https?%3A/i.test(SRC)) SRC = decodeURIComponent(SRC);
  const video = document.getElementById("video");
  const msg = document.getElementById("msg");

  function show(text) {
    msg.textContent = text;
    msg.style.display = text ? "block" : "none";
  }

  // --- Helper fullscreen dengan fallback vendor ---
  function enterFullscreen(el) {
    const fn = el.requestFullscreen
      || el.webkitRequestFullscreen
      || el.webkitEnterFullscreen
      || el.mozRequestFullScreen
      || el.msRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  }
  function exitFullscreen() {
    const fn = document.exitFullscreen
      || document.webkitExitFullscreen
      || document.mozCancelFullScreen
      || document.msExitFullscreen;
    if (fn) { try { fn.call(document); } catch (e) {} }
  }
  function toggleFullscreen() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) exitFullscreen();
    else enterFullscreen(document.documentElement);
  }

  if (!SRC) {
    show("URL kosong. Pakai: m3u8.html?url=LINK_M3U8");
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      fetchSetup: (ctx, init) => {
        init.referrerPolicy = "no-referrer";
        init.referrer = "";
        return new Request(ctx.url, init);
      }
    });
    hls.loadSource(SRC);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      show("");
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { show("Jaringan bermasalah, mencoba lagi..."); hls.startLoad(); }
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { show("Memulihkan media..."); hls.recoverMediaError(); }
      else { show("Error: " + d.details); hls.destroy(); }
    });
    video.addEventListener("playing", () => show(""));
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = SRC;
    video.play().catch(() => {});
  } else {
    show("Browser tidak mendukung HLS.");
  }

  // Klik dua kali untuk fullscreen sungguhan
  video.addEventListener("dblclick", toggleFullscreen);

  // Sembunyikan overlay saat fullscreen berubah
  ["fullscreenchange", "webkitfullscreenchange"].forEach(ev =>
    document.addEventListener(ev, () => {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFs) show("");
    })
  );

  // Cegah menu konteks saat long-press
  video.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
