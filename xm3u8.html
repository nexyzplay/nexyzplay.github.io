<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>M3U8 Player</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  :fullscreen #msg, :-webkit-full-screen #msg { display: none !important; }
  #msg {
    position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%);
    max-width: 90%; padding: 8px 14px; border-radius: 6px;
    background: rgba(0,0,0,.75); color: #fff; font: 14px system-ui, sans-serif;
    text-align: center; display: none; z-index: 10;
  }
</style>
</head>
<body>
<video id="video" controls autoplay playsinline
       referrerpolicy="no-referrer"
       disablepictureinpicture
       controlslist="nodownload noplaybackrate"></video>
<div id="msg" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  // ================= PENGATURAN =================
  const REFRESH_MS = 90 * 1000;  // refresh tiap 90 detik (link expired 2 menit)
  const PROXY = "";              // opsional, contoh: "https://nama.workers.dev/" atau
                                 // "https://nama.vercel.app/api/proxy". Kosong = tanpa proxy.
  // ==============================================

  const m = location.search.match(/[?&]url=(.*)$/);
  let ORIGIN = m ? m[1] : "";
  if (/^https?%3A/i.test(ORIGIN)) ORIGIN = decodeURIComponent(ORIGIN);

  const video = document.getElementById("video");
  const msg = document.getElementById("msg");

  function show(text) {
    msg.textContent = text;
    msg.style.display = text ? "block" : "none";
  }

  // ---------- Fullscreen ----------
  function enterFullscreen(el) {
    const fn = el.requestFullscreen || el.webkitRequestFullscreen
      || el.webkitEnterFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (fn) { try { fn.call(el); } catch (e) {} }
  }
  function exitFullscreen() {
    const fn = document.exitFullscreen || document.webkitExitFullscreen
      || document.mozCancelFullScreen || document.msExitFullscreen;
    if (fn) { try { fn.call(document); } catch (e) {} }
  }
  function toggleFullscreen() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) exitFullscreen(); else enterFullscreen(document.documentElement);
  }

  // ---------- URL sumber (selalu segar) ----------
  function freshUrl() {
    const sep = ORIGIN.includes("?") ? "&" : "?";
    const u = ORIGIN + sep + "_=" + Date.now(); // paksa server beri link baru
    return PROXY ? PROXY + (PROXY.includes("?") ? "&" : "?") + "u=" + encodeURIComponent(u) : u;
  }

  function tryPlay() {
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  }

  // ---------- Mode: native (tanpa CORS) ----------
  const NATIVE = !!video.canPlayType("application/vnd.apple.mpegurl");
  const HLSJS = !!(window.Hls && Hls.isSupported());
  // Jika PROXY diisi, utamakan hls.js lewat proxy. Jika tidak, utamakan native.
  let mode = (NATIVE && !PROXY) || (NATIVE && !HLSJS) ? "native" : (HLSJS ? "hlsjs" : "none");

  let hls = null;
  let busy = false;

  function loadNative(isRefresh) {
    if (isRefresh) show("Memperbarui link...");
    video.src = freshUrl();
    tryPlay();
  }

  function ensureHls() {
    if (hls) return;
    hls = new Hls({
      fetchSetup: (ctx, init) => {
        init.referrerPolicy = "no-referrer";
        init.referrer = "";
        return new Request(ctx.url, init);
      }
    });
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { show(""); tryPlay(); });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        show("Jaringan bermasalah, mengambil link baru...");
        setTimeout(() => load(true), 1500);
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
        show("Memulihkan media...");
        hls.recoverMediaError();
      } else {
        show("Error: " + d.details);
      }
    });
  }

  function loadHls(isRefresh) {
    ensureHls();
    if (isRefresh) show("Memperbarui link...");
    hls.loadSource(freshUrl());
    hls.startLoad(-1);
  }

  function load(isRefresh) {
    if (busy) return;
    busy = true;
    try {
      if (mode === "native") loadNative(isRefresh);
      else if (mode === "hlsjs") loadHls(isRefresh);
    } finally {
      setTimeout(() => { busy = false; }, 800);
    }
  }

  // Native gagal -> otomatis coba hls.js
  video.addEventListener("error", () => {
    if (mode === "native" && HLSJS) {
      mode = "hlsjs";
      video.removeAttribute("src");
      video.load();
      show(PROXY ? "Beralih ke hls.js..." : "Beralih ke hls.js (butuh CORS)...");
      load(false);
    }
  });

  video.addEventListener("playing", () => show(""));

  // ---------- Mulai ----------
  if (!ORIGIN) {
    show("URL kosong. Pakai: xm3u8.html?url=LINK_ATAU_REDIRECT");
  } else if (mode === "none") {
    show("Browser tidak mendukung HLS.");
  } else {
    load(false);
    setInterval(() => load(true), REFRESH_MS);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) load(true);
    });
  }

  video.addEventListener("dblclick", toggleFullscreen);
  ["fullscreenchange", "webkitfullscreenchange"].forEach(ev =>
    document.addEventListener(ev, () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) show("");
    })
  );
  video.addEventListener("contextmenu", e => e.preventDefault());
</script>
</body>
</html>
