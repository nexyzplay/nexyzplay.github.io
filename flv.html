<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexyz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #dplayer {
      width: 100%;
      height: 100%;
    }
    .error-box {
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 90%;
    }
    .error-box code {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: #000;
      color: #00ff88;
      border-radius: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="dplayer"></div>

  <!-- Gunakan mpegts.js sebagai pengganti flv.js agar lebih stabil menangani redirect & live stream Huya -->
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>

  <script>
    // Ambil raw parameter 'url' agar jika ada parameter tambahan di dalam link tidak terpotong
    function getTargetUrl() {
      const search = window.location.search;
      const match = search.match(/[?&]url=([^&]+(?:&.*)?)/);
      if (!match) return null;
      
      let rawUrl = match[1];
      // Pisahkan jika ada parameter khusus player di akhir seperti &live=false
      rawUrl = rawUrl.replace(/&live=(true|false)/g, '');
      
      try {
        return decodeURIComponent(rawUrl);
      } catch (e) {
        return rawUrl;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = getTargetUrl();
    // Default true untuk live stream (Huya), kecuali ditulis &live=false
    const isLive = urlParams.get('live') !== 'false'; 

    const container = document.getElementById('dplayer');

    if (!videoUrl) {
      container.style.display = 'flex';
      container.style.justifyContent = 'center';
      container.style.alignItems = 'center';
      container.innerHTML = `
        <div class="error-box">
          <h3>URL Stream Tidak Ditemukan</h3>
          <p style="margin-top:8px; color:#aaa; font-size:14px;">Contoh penggunaan:</p>
          <code>flv.html?url=https://xcdn-hy.vercel.app/?id=30805929</code>
        </div>
      `;
    } else {
      let mpegtsPlayer = null;

      const dp = new DPlayer({
        container: container,
        live: isLive,
        autoplay: true,
        theme: '#ff9600', // Warna khas Huya
        video: {
          url: videoUrl,
          type: 'customFlv',
          customType: {
            customFlv: function (video, player) {
              if (mpegts.getFeatureList().mseLivePlayback) {
                mpegtsPlayer = mpegts.createPlayer({
                  type: 'flv',
                  isLive: isLive,
                  url: video.src,
                  cors: true,
                  withCredentials: false
                }, {
                  enableWorker: true,
                  enableStashBuffer: false,
                  stashInitialSize: 128, // Buffer awal kecil agar cepat muncul
                  liveBufferLatencyChasing: true, // Kejar ketertinggalan delay live
                  autoCleanupSourceBuffer: true // Bersihkan memori otomatis saat live lama
                });

                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();

                // Tangani error jaringan / putus stream
                mpegtsPlayer.on(mpegts.Events.ERROR, (errType, errDetail) => {
                  console.warn('Stream terputus/error:', errType, errDetail);
                });
              }
            }
          }
        }
      });

      // Coba autoplay (browser modern kadang mewajibkan mute saat autoplay pertama kali)
      dp.on('canplay', function () {
        dp.play().catch(() => {
          dp.video.muted = true;
          dp.play();
        });
      });
    }
  </script>

</body>
</html>
