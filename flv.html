<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script
    src="https://code.jquery.com/jquery-3.2.1.min.js"
    integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="mousetrap.min.js" charset="utf-8"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #single-view, #multi-view-frame {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #video-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }
    #video {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      margin: auto;
      max-height: 100%;
      max-width: 100%;
      width: 100%;
      height: 100%;
    }
    [data-player-mount] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    [data-player-mount]:not(:empty) {
      pointer-events: auto;
    }
    #countdown {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
    }
    #multi-view-frame {
      display: none;
      border: 0;
    }
  </style>
  <title>M3U8 Player running...</title>
</head>
<body>
  <div id="single-view">
    <img id="video-placeholder" src="/images/index.png" alt="">
    <video id="video" controls=""></video>
    <div data-player-mount=""></div>
    <div id="countdown">
      <div class="countdown-title">Event will start in:</div>
      <div class="countdown-timer"></div>
    </div>
  </div>

  <iframe id="multi-view-frame" allowfullscreen></iframe>

  <script src="player.js"></script>
</body>
</html>
