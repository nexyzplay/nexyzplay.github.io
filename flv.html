<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nexyz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #dplayer {
      width: 100%;
      height: 100%;
    }
    /* Sembunyikan kontrol & kursor saat idle (2 detik) */
    #dplayer.controls-hidden .dplayer-controller,
    #dplayer.controls-hidden .dplayer-controller-mask {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #dplayer.controls-hidden {
      cursor: none;
    }
    .dplayer-controller,
    .dplayer-controller-mask {
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .error-box {
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 90%;
    }
    .error-box code {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: #000;
      color: #00ff88;
      border-radius: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="dplayer"></div>

  <!-- Load mpegts.js v1.7.3 & DPlayer -->
  <script src="https://live.kltratv.site/vendor/mpegts-1.7.3.js?v=20261118T063723525Z-aef60c6ae959"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>

  <script>
    function getTargetUrl() {
      const search = window.location.search;
      const match = search.match(/[?&]url=([^&]+(?:&.*)?)/);
      if (!match) return null;

      let rawUrl = match[1];
      rawUrl = rawUrl.replace(/&live=(true|false)/g, '');

      try {
        return decodeURIComponent(rawUrl);
      } catch (e) {
        return rawUrl;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = getTargetUrl();
    const isLive = urlParams.get('live') !== 'false';
    const container = document.getElementById('dplayer');

    if (!videoUrl) {
      container.style.display = 'flex';
      container.style.justifyContent = 'center';
      container.style.alignItems = 'center';
      container.innerHTML = `
        <div class="error-box">
          <h3>URL Stream Tidak Ditemukan</h3>
          <p style="margin-top:8px; color:#aaa; font-size:14px;">Contoh penggunaan:</p>
          <code>flv.html?url=https://xcdn-hy.vercel.app/?id=30805929</code>
        </div>
      `;
    } else {
      let mpegtsPlayer = null;
      let hideTimer = null;

      function showControlsTemp() {
        container.classList.remove('controls-hidden');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
          container.classList.add('controls-hidden');
        }, 2000);
      }

      ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach((evt) => {
        window.addEventListener(evt, showControlsTemp, { passive: true });
      });

      const dp = new DPlayer({
        container: container,
        live: isLive,
        autoplay: true,
        theme: '#ff9600',
        video: {
          url: videoUrl,
          type: 'customFlv',
          customType: {
            customFlv: function (video, player) {
              if (typeof mpegts !== 'undefined' && mpegts.getFeatureList().mseLivePlayback) {
                mpegtsPlayer = mpegts.createPlayer({
                  type: 'flv',
                  isLive: isLive,
                  url: video.src,
                  cors: true,
                  withCredentials: false
                }, {
                  enableWorker: true,
                  enableStashBuffer: true,
                  stashInitialSize: 1024,          // Bantalan awal 1 MB (~3 detik tergantung bitrate)
                  liveBufferLatencyChasing: false, // Hindari jeda/lompatan akibat kejar latency
                  autoCleanupSourceBuffer: false   // Hindari jeda pembersihan buffer saat live
                });

                mpegtsPlayer.attachMediaElement(video);
                mpegtsPlayer.load();

                mpegtsPlayer.on(mpegts.Events.ERROR, (errType, errDetail) => {
                  console.warn('mpegts error:', errType, errDetail);
                });
              } else {
                console.error('mpegts.js tidak termuat atau browser tidak mendukung MSE.');
              }
            }
          }
        }
      });

      showControlsTemp();

      dp.on('canplay', function () {
        dp.play().catch(() => {
          dp.video.muted = true;
          dp.play();
        });
      });
    }
  </script>

</body>
</html>
