<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Huya Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.css">
</head>
<body>
  <div id="player"></div>
  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xgplayer-flv@3.0.20/dist/index.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const params = new URLSearchParams(location.search);

    // Nilai url bisa sudah memuat ?id=... di dalamnya
    let target = params.get('url');
    let id = params.get('id');

    if (target) {
      try {
        const u = new URL(target);
        if (!id) id = u.searchParams.get('id');       // ambil id dari dalam url
        else if (!u.searchParams.has('id')) {         // id terpisah -> tempel ke url
          u.searchParams.set('id', id);
          target = u.toString();
        }
      } catch (e) {
        status.textContent = 'Parameter url tidak valid';
      }
    }

    function play(url) {
      status.textContent = '';
      new Player({
        id: 'player',
        url,
        isLive: true,
        autoplay: true,
        autoplayMuted: true,
        width: '100%',
        height: 480,
        plugins: [FlvPlugin]
      });
    }

    // Cari link FLV di dalam JSON (mendukung beberapa bentuk umum)
    function pickUrl(j) {
      if (typeof j === 'string') return j;
      return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
    }

    async function start() {
      if (!target && !id) { status.textContent = 'Pakai: ?url=ENDPOINT/?id=ROOM_ID'; return; }
      if (!target) { status.textContent = 'Parameter url belum diisi'; return; }
      if (!FlvPlugin.isSupported()) { status.textContent = 'Browser tidak mendukung FLV (MSE)'; return; }

      status.textContent = 'Mengambil stream...';
      const ctrl = new AbortController();
      try {
        const res = await fetch(target, { signal: ctrl.signal });
        const type = res.headers.get('content-type') || '';

        if (type.includes('json')) {
          const j = await res.json();
          if (j?.live === false) { status.textContent = 'Room offline / tidak ditemukan'; return; }
          const flv = pickUrl(j);
          if (!flv) { status.textContent = 'Respons JSON tidak berisi link FLV'; return; }
          play(flv);
        } else if (type.includes('text/plain') || type.includes('text/html')) {
          const t = (await res.text()).trim();
          if (/^https?:\/\//.test(t)) play(t);
          else status.textContent = 'Respons tidak dikenali: ' + t.slice(0, 100);
        } else {
          // Kemungkinan endpoint langsung mengalirkan FLV
          ctrl.abort();
          play(target);
        }
      } catch (e) {
        if (e.name === 'AbortError') return;
        status.textContent = 'Gagal: ' + e.message + ' (cek CORS / tunnel masih hidup?)';
      }
    }
    start();
  </script>
</body>
</html>
