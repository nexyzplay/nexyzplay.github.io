<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexyz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    #dplayer {
      width: 100%;
      height: 100%;
    }
    .error-box {
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 90%;
    }
    .error-box code {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: #000;
      color: #00ff88;
      border-radius: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="dplayer"></div>

  <!-- Load Engine FLV & DPlayer -->
  <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>

  <script>
    // 1. Ambil parameter dari URL browser
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    // Opsional: bisa tambah &live=true di URL jika untuk live stream
    const isLive = urlParams.get('live') === 'true'; 

    const container = document.getElementById('dplayer');

    if (!videoUrl) {
      // Tampilkan pesan panduan jika parameter ?url= kosong
      container.style.display = 'flex';
      container.style.justifyContent = 'center';
      container.style.alignItems = 'center';
      container.innerHTML = `
        <div class="error-box">
          <h3>URL Video Tidak Ditemukan</h3>
          <p style="margin-top:8px; color:#aaa; font-size:14px;">Gunakan format parameter berikut pada alamat browser:</p>
          <code>flv.html?url=https://domain.com/video.flv</code>
        </div>
      `;
    } else {
      // 2. Inisialisasi DPlayer jika parameter ?url= ada
      const dp = new DPlayer({
        container: container,
        live: isLive,
        autoplay: true,
        theme: '#00a1d6',
        video: {
          url: videoUrl,
          type: 'flv',
        },
        pluginOptions: {
          flv: {
            mediaDataSource: {
              isLive: isLive,
              cors: true,
              withCredentials: false,
            },
            config: {
              enableWorker: true,
              enableStashBuffer: false,
            },
          },
        },
      });

      dp.on('error', function () {
        console.error('Gagal memutar stream/video FLV:', videoUrl);
      });
    }
  </script>

</body>
</html>
