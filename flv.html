<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Huya Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.css">
</head>
<body>
  <div id="player"></div>
  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xgplayer-flv@3.0.20/dist/index.min.js"></script>
  <script>
    const status = document.getElementById('status');
    const id = new URLSearchParams(location.search).get('id');
    const API = `https://mp.huya.com/cache.php?m=Live&do=profileRoom&roomid=${id}`;

    // Urutan percobaan: langsung -> lewat proxy
    const attempts = [
      API,
      'https://corsproxy.io/?' + encodeURIComponent(API),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(API)
    ];

    async function getRoom() {
      for (const u of attempts) {
        try {
          const r = await fetch(u);
          if (r.ok) return await r.json();
        } catch (e) { /* coba berikutnya */ }
      }
      throw new Error('Semua percobaan gagal (kemungkinan CORS)');
    }

    async function start() {
      if (!id) { status.textContent = 'Pakai: ?id=ROOM_ID'; return; }
      if (!FlvPlugin.isSupported()) { status.textContent = 'Browser tidak mendukung FLV (MSE)'; return; }

      status.textContent = 'Mengambil stream...';
      try {
        const j = await getRoom();
        const d = j?.data;
        if (!d || d.liveStatus !== 'ON') { status.textContent = 'Room offline / tidak ditemukan'; return; }

        const s = d.stream.baseSteamInfoList[0];
        const url = `${s.sFlvUrl}/${s.sStreamName}.${s.sFlvUrlSuffix}?${s.sFlvAntiCode}`
          .replace('http://', 'https://');

        status.textContent = '';
        new Player({
          id: 'player',
          url,
          isLive: true,
          autoplay: true,
          autoplayMuted: true,
          width: '100%',
          height: 480,
          plugins: [FlvPlugin]
        });
      } catch (e) {
        status.textContent = 'Gagal: ' + e.message;
      }
    }
    start();
  </script>
</body>
</html>
