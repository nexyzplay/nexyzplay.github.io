<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexyz - WXInlinePlayer</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    /* Container Utama */
    #wrap { width: 100vw; height: 100vh; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    
    /* WXInlinePlayer menggunakan Canvas. Kita paksa agar ukurannya menyesuaikan container */
    #container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }

    #wrap:fullscreen { width: 100vw; height: 100vh; }
    #wrap.rotated {
      position: fixed; top: 0; left: 0; width: 100vh; height: 100vw;
      transform-origin: top left; transform: translateX(100vw) rotate(90deg); z-index: 9999;
    }

    #status { position: absolute; top: 20px; left: 20px; z-index: 100; font-size: 14px; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none; }

    /* ===== Panel Kontrol ===== */
    #ctrlPanel {
      position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 20px 15px 10px 15px; display: flex; flex-direction: column; gap: 8px;
      box-sizing: border-box; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #wrap:hover #ctrlPanel, #wrap.showCtrl #ctrlPanel { opacity: 1; pointer-events: auto; }
    #wrap:fullscreen #ctrlPanel { opacity: 0; pointer-events: none; }
    #wrap:fullscreen.showCtrl #ctrlPanel { opacity: 1; pointer-events: auto; }

    .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: relative; }
    .progress-bar-inner { height: 100%; width: 100%; background: #ff0000; border-radius: 2px; }

    .controls-row { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 14px; }
    .left-controls, .right-controls { display: flex; align-items: center; gap: 15px; }
    .controls-row button { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 18px; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .controls-row button:hover { color: #ccc; }

    .vol-wrap { display: flex; align-items: center; gap: 5px; }
    .vol-wrap input[type=range] { width: 80px; accent-color: #fff; cursor: pointer; }
    .time-display { font-family: monospace; font-size: 14px; margin-left: 10px; }
    .live-badge { font-size: 12px; opacity: 0.8; margin-left: 5px; color: #ff0000; font-weight: bold; }

    #exit { display: none; position: fixed; top: 10px; left: 10px; z-index: 10000; padding: 6px 10px; border: 0; border-radius: 6px; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="container">
        <!-- Canvas akan diurus ukurannya oleh CSS di atas -->
        <canvas id="wx-canvas"></canvas>
    </div>
    <div id="status"></div>

    <div id="ctrlPanel">
      <div class="progress-bar"><div class="progress-bar-inner"></div></div>
      <div class="controls-row">
        <div class="left-controls">
          <button id="cPlay" title="Play / Pause">▶</button>
          <span class="time-display" id="liveTime">0:00</span>
          <span class="live-badge">LIVE</span>
        </div>
        <div class="right-controls">
          <div class="vol-wrap">
            <button id="cMute" title="Mute">🔊</button>
            <input id="cVol" type="range" min="0" max="100" value="80" title="Volume">
          </div>
          <button id="cFull" title="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
  </div>
  <button id="exit">✕ Keluar</button>

  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script src="./index.js"></script>
  
  <script>
    window.addEventListener('load', () => {
      const statusEl = document.getElementById('status');
      const wrap = document.getElementById('wrap');
      const btnExit = document.getElementById('exit');
      const canvasEl = document.getElementById('wx-canvas');
      const show = m => statusEl.textContent = m;

      window.addEventListener('error', e => show('Error: ' + e.message));
      window.addEventListener('unhandledrejection', e => show('Error: ' + (e.reason?.message || e.reason)));

      const params = new URLSearchParams(location.search);
      const target = params.get('url');
      let player = null;
      let audioUnlocked = false;
      let hideCtrlTimer = null;

      if (typeof WXInlinePlayer === 'undefined') {
        return show('Error: index.js tidak terdeteksi.');
      }

      // ===== Wake Lock =====
      let wakeLock = null;
      const noSleep = window.NoSleep ? new NoSleep() : null;
      let noSleepOn = false;
      async function keepAwake() {
        if (wakeLock) return;
        try {
          if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
            return;
          }
        } catch (e) {}
        try {
          if (noSleep && !noSleepOn) { await noSleep.enable(); noSleepOn = true; }
        } catch (e) {}
      }
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
      document.addEventListener('fullscreenchange', keepAwake);
      ['click', 'touchend'].forEach(ev => document.addEventListener(ev, keepAwake, { passive: true }));
      keepAwake();

      // ===== Rotated fallback =====
      function forceRotate(on) {
        wrap.classList.toggle('rotated', on);
        btnExit.style.display = on ? 'block' : 'none';
      }

      // ===== Fullscreen toggle =====
      async function toggleFullscreen() {
        keepAwake();
        if (document.fullscreenElement) {
          try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
          try { await document.exitFullscreen(); } catch (e) {}
          return;
        }
        if (wrap.classList.contains('rotated')) { forceRotate(false); return; }
        try {
          await wrap.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
          showCtrl();
          return;
        } catch (e) { forceRotate(true); showCtrl(); }
      }

      btnExit.onclick = async () => {
        if (wrap.classList.contains('rotated')) { forceRotate(false); return; }
        if (document.fullscreenElement) {
          try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
          try { await document.exitFullscreen(); } catch (e) {}
        }
      };

      document.addEventListener('fullscreenchange', () => {
        const isFs = !!document.fullscreenElement || wrap.classList.contains('rotated');
        btnExit.style.display = isFs ? 'block' : 'none';
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
      });

      // ===== Tombol Kontrol =====
      const cPlay = document.getElementById('cPlay');
      const cMute = document.getElementById('cMute');
      const cVol  = document.getElementById('cVol');
      const cFull = document.getElementById('cFull');
      const liveTime = document.getElementById('liveTime');

      let playing = true;
      let muted = false;
      let lastVol = 80;

      // ===== Audio Unlock =====
      function unlockAudio() {
        if (audioUnlocked || !player) return;
        try {
          player.mute(false);
          player.volume(lastVol / 100);
          // WXInlinePlayer play() tidak mengembalikan promise, jadi panggil tanpa .catch()
          if (playing) player.play();
        } catch (e) {}
        audioUnlocked = true;
        cMute.textContent = '🔊';
      }

      wrap.addEventListener('click', unlockAudio);
      wrap.addEventListener('touchstart', unlockAudio, { passive: true });

      cPlay.onclick = () => {
        if (!player) return;
        if (playing) {
          player.pause();
          cPlay.textContent = '▶';
          playing = false;
        } else {
          // resume() hanya untuk VOD, untuk live gunakan play()
          if (player.isLive) player.play(); 
          else player.resume();
          cPlay.textContent = '⏸';
          playing = true;
          unlockAudio();
        }
      };

      cMute.onclick = () => {
        if (!player) return;
        muted = !muted;
        if (muted) {
          lastVol = +cVol.value || 80;
          cVol.value = 0;
          player.volume(0);
          cMute.textContent = '🔇';
        } else {
          cVol.value = lastVol;
          player.mute(false);
          player.volume(lastVol / 100);
          cMute.textContent = '🔊';
        }
      };

      cVol.oninput = () => {
        if (!player) return;
        const v = +cVol.value;
        player.volume(v / 100);
        if (v > 0) { muted = false; cMute.textContent = '🔊'; }
        else { muted = true; cMute.textContent = '🔇'; }
      };

      cFull.onclick = toggleFullscreen;

      function showCtrl() {
        wrap.classList.add('showCtrl');
        clearTimeout(hideCtrlTimer);
        hideCtrlTimer = setTimeout(() => { wrap.classList.remove('showCtrl'); }, 2500);
      }
      wrap.addEventListener('mousemove', showCtrl);
      wrap.addEventListener('touchstart', showCtrl, { passive: true });

      // ===== Player Initialization =====
      async function initPlayer(url) {
        show('Memuat decoder...');
        
        if (!WXInlinePlayer.isSupport()) {
          show('Browser tidak mendukung WebAssembly/ASM.');
          return;
        }

        try {
          await WXInlinePlayer.init({
              asmUrl: './prod.all.asm.combine.js',
              wasmUrl: './prod.all.wasm.combine.js'
          });
          await WXInlinePlayer.ready();
        } catch (e) {
          show('Error: Decoder gagal dimuat.');
          console.error(e);
          return;
        }

        show('Menghubungkan stream...');

        player = new WXInlinePlayer({
          url: url,
          $container: canvasEl,
          hasVideo: true,
          hasAudio: true,
          volume: lastVol / 100,
          muted: false,
          autoplay: true,
          isLive: true,
          chunkSize: 128 * 1024,
          preloadTime: 500,
          bufferingTime: 1000,
          cacheSegmentCount: 64
        });

        player.on('playing', () => {
          show('');
          playing = true;
          cPlay.textContent = '⏸';
          keepAwake();
        });

        player.on('loadError', (err) => {
          show('Stream error: ' + (err.detail || err.statusText));
        });

        // Panggil play() tanpa .catch()
        player.play();
        
        // Fallback untuk autoplay yang diblokir
        setTimeout(() => {
          if (!audioUnlocked) show('Klik layar jika video belum berjalan/muncul suara');
        }, 2000);
      }

      let secondsElapsed = 0;
      setInterval(() => {
        if (playing && player) {
          secondsElapsed++;
          const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
          const s = (secondsElapsed % 60).toString().padStart(2, '0');
          liveTime.textContent = `${m}:${s}`;
        }
      }, 1000);

      async function start() {
        if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');
        show('Loading...');
        
        const ctrl = new AbortController();
        try {
          const res = await fetch(target, { signal: ctrl.signal });
          const type = res.headers.get('content-type') || '';

          if (type.includes('json')) {
            const j = await res.json();
            if (j?.live === false) return show('Room offline / tidak ditemukan');
            const flv = j?.url || j?.flv || j?.data?.url || j?.data?.flv;
            if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
            initPlayer(flv);
          } else if (type.includes('text/')) {
            const t = (await res.text()).trim();
            if (/^https?:\/\//.test(t)) initPlayer(t);
            else show('Respons tidak dikenali: ' + t.slice(0, 150));
          } else {
            ctrl.abort();
            initPlayer(target);
          }
        } catch (e) {
          show('Fetch error: ' + e.message);
        }
      }
      
      start();
    });
  </script>
</body>
</html>
