<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexyz</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    /* Container Utama */
    #wrap { width: 100%; height: 100%; background: #000; position: relative; overflow: hidden; }
    #container { width: 100%; height: 100%; }

    /* Fullscreen */
    #wrap:fullscreen { width: 100%; height: 100%; }

    /* Putar paksa (fallback iPhone) */
    #wrap.rotated {
      position: fixed; top: 0; left: 0;
      width: 100vh; height: 100vw;
      transform-origin: top left;
      transform: translateX(100vw) rotate(90deg);
      z-index: 9999;
    }

    /* ===== Status / Error ===== */
    #status {
      position: absolute; top: 20px; left: 20px; z-index: 100;
      font-size: 14px; color: #fff; text-shadow: 1px 1px 2px #000;
      pointer-events: none;
    }

    /* ===== Panel Kontrol (seperti gambar) ===== */
    #ctrlPanel {
      position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      padding: 20px 15px 10px 15px;
      display: flex; flex-direction: column; gap: 8px;
      box-sizing: border-box;
      opacity: 0; transition: opacity 0.3s;
    }
    #wrap:hover #ctrlPanel,
    #wrap.showCtrl #ctrlPanel { opacity: 1; }

    /* Progress Bar (Live stream = statis, hanya visual) */
    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.2);
      border-radius: 2px; position: relative; overflow: hidden;
    }
    .progress-bar::after {
      content: ''; position: absolute; top: 0; left: 0;
      height: 100%; width: 100%; background: #ff0000; /* Merah seperti YouTube */
      transform-origin: left; animation: pulse 2s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

    /* Baris tombol & teks */
    .controls-row {
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-size: 13px;
    }
    .left-controls, .right-controls {
      display: flex; align-items: center; gap: 15px;
    }
    
    /* Ikon & Tombol */
    .controls-row button {
      background: transparent; border: none; color: #fff; cursor: pointer;
      font-size: 16px; padding: 5px; display: flex; align-items: center;
      justify-content: center; transition: color 0.2s;
    }
    .controls-row button:hover { color: #ccc; }

    /* Volume slider */
    .vol-wrap { display: flex; align-items: center; gap: 5px; }
    .vol-wrap input[type=range] {
      width: 70px; accent-color: #fff; cursor: pointer;
    }

    /* Time display */
    .time-display { font-family: monospace; font-size: 13px; }

    /* Tombol Exit */
    #exit {
      display: none; position: fixed; top: 10px; left: 10px; z-index: 10000;
      padding: 6px 10px; border: 0; border-radius: 6px; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="container"></div>
    <div id="status"></div>

    <!-- Panel Kontrol -->
    <div id="ctrlPanel">
      <!-- Garis Progress (Visual saja untuk live) -->
      <div class="progress-bar"></div>
      
      <!-- Baris Kontrol -->
      <div class="controls-row">
        <div class="left-controls">
          <button id="cPlay" title="Play / Pause">▶</button>
          <span class="time-display" id="liveTime">0:00</span>
          <span style="font-size: 11px; opacity: 0.7; margin-left: 5px;">LIVE</span>
        </div>
        
        <div class="right-controls">
          <div class="vol-wrap">
            <button id="cMute" title="Mute">🔇</button>
            <input id="cVol" type="range" min="0" max="100" value="80" title="Volume">
          </div>
          <button id="cFull" title="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
  </div>

  <button id="exit">✕ Keluar</button>

  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script src="jessibuca.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const wrap = document.getElementById('wrap');
    const btnExit = document.getElementById('exit');
    const show = m => statusEl.textContent = m;
    window.addEventListener('error', e => show('Error: ' + e.message));
    window.addEventListener('unhandledrejection', e => show('Error: ' + (e.reason?.message || e.reason)));

    const params = new URLSearchParams(location.search);
    const target = params.get('url');
    let player;

    // ===== Cegah layar redup / mati =====
    let wakeLock = null;
    const noSleep = window.NoSleep ? new NoSleep() : null;
    let noSleepOn = false;

    async function keepAwake() {
      if (wakeLock) return;
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          return;
        }
      } catch (e) {}
      try {
        if (noSleep && !noSleepOn) { await noSleep.enable(); noSleepOn = true; }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });
    document.addEventListener('fullscreenchange', keepAwake);
    ['click', 'touchend'].forEach(ev => document.addEventListener(ev, keepAwake, { passive: true }));
    keepAwake();

    // ===== Landscape =====
    function refit() {
      setTimeout(() => {
        try { player && player.resize && player.resize(); } catch (e) {}
        try { player && player.setScaleMode(0); } catch (e) {}
      }, 150);
    }

    function forceRotate(on) {
      wrap.classList.toggle('rotated', on);
      btnExit.style.display = on ? 'block' : 'none';
      refit();
    }

    async function goLandscape() {
      keepAwake();
      try { player && player.audioResume && player.audioResume(); } catch (e) {}
      try {
        await wrap.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
        refit();
        return;
      } catch (e) {}
      forceRotate(true);
    }

    btnExit.onclick = () => forceRotate(false);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
      refit();
    });
    window.addEventListener('resize', refit);

    // ===== Tombol Kontrol =====
    const cPlay = document.getElementById('cPlay');
    const cMute = document.getElementById('cMute');
    const cVol  = document.getElementById('cVol');
    const cFull = document.getElementById('cFull');
    const liveTime = document.getElementById('liveTime');

    let playing = true;
    let muted = false;
    let lastVol = 80;

    // Play / Pause
    cPlay.onclick = () => {
      try {
        if (playing) { player && player.pause && player.pause(); cPlay.textContent = '▶'; playing = false; }
        else { player && player.play && player.play(); cPlay.textContent = '⏸'; playing = true; }
      } catch (e) {}
    };

    // Mute
    cMute.onclick = () => {
      try {
        muted = !muted;
        if (muted) {
          lastVol = +cVol.value;
          cVol.value = 0;
          player && player.setVolume && player.setVolume(0);
          cMute.textContent = '🔇';
        } else {
          cVol.value = lastVol;
          player && player.setVolume && player.setVolume(lastVol / 100);
          cMute.textContent = '🔊';
        }
      } catch (e) {}
    };

    // Volume Slider
    cVol.oninput = () => {
      try {
        const v = +cVol.value;
        player && player.setVolume && player.setVolume(v / 100);
        if (v > 0) { muted = false; cMute.textContent = '🔊'; }
        else { muted = true; cMute.textContent = '🔇'; }
      } catch (e) {}
    };

    // Fullscreen
    cFull.onclick = goLandscape;

    // Tampilkan Panel saat disentuh di Mobile
    wrap.addEventListener('touchstart', () => {
      wrap.classList.add('showCtrl');
      clearTimeout(wrap._ctrlTimer);
      wrap._ctrlTimer = setTimeout(() => wrap.classList.remove('showCtrl'), 3000);
    }, { passive: true });

    // ===== Player Jessibuca =====
    function pickUrl(j) {
      if (typeof j === 'string') return j;
      return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
    }

    function play(url) {
      show('');
      if (player) player.destroy();
      
      player = new Jessibuca({
        container: document.getElementById('container'),
        videoBuffer: 1,
        isResize: true,
        isFullResize: false,
        useMSE: false,
        text: '',
        loadingText: 'Memuat...',
        showBandwidth: false,
        forceNoOffscreen: true,
        isNotMute: false,
        // Matikan panel bawaan karena kita pakai panel kustom di bawah
        operateBtns: { fullscreen: false, screenshot: false, play: false, audio: false }
      });

      player.on('error', e => show('Stream error: ' + e));
      player.on('start', () => {
        refit();
        keepAwake();
        playing = true;
        cPlay.textContent = '⏸';
        try { player.setVolume && player.setVolume(cVol.value / 100); } catch (e) {}
      });
      player.play(url);
    }

    // Timer untuk update waktu (0:00, 0:01, dst...) karena live stream tidak punya durasi
    let secondsElapsed = 0;
    setInterval(() => {
      if (playing && player) {
        secondsElapsed++;
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        liveTime.textContent = `${m}:${s}`;
      }
    }, 1000);

    async function start() {
      if (!window.Jessibuca) return show('jessibuca.js tidak ditemukan');
      if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');

      show('Loading...');
      const ctrl = new AbortController();
      const res = await fetch(target, { signal: ctrl.signal });
      const type = res.headers.get('content-type') || '';

      if (type.includes('json')) {
        const j = await res.json();
        if (j?.live === false) return show('Room offline / tidak ditemukan');
        const flv = pickUrl(j);
        if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
        play(flv);
      } else if (type.includes('text/')) {
        const t = (await res.text()).trim();
        if (/^https?:\/\//.test(t)) play(t);
        else show('Respons tidak dikenali: ' + t.slice(0, 150));
      } else {
        ctrl.abort();
        play(target);
      }
    }
    start();
  </script>
</body>
</html>
