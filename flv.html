<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexyz</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    /* Paksa GPU rendering untuk container video */
    #wrap { 
      width: 100%; aspect-ratio: 16 / 9; max-height: 100vh; background: #000; 
      position: relative; overflow: hidden; margin: 0 auto;
      transform: translateZ(0);
    }
    #container { width: 100%; height: 100%; }

    /* Fullscreen */
    #wrap:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; max-height: none; margin: 0; }
    #wrap:fullscreen #ctrlPanel { display: none !important; }

    /* Rotated fallback */
    #wrap.rotated {
      position: fixed; top: 0; left: 0; width: 100vh; height: 100vw; aspect-ratio: auto; max-height: none;
      transform-origin: top left; transform: translateX(100vw) rotate(90deg); z-index: 9999;
    }
    #wrap.rotated #ctrlPanel { display: none !important; }

    /* Status / Error */
    #status { position: absolute; top: 20px; left: 20px; z-index: 100; font-size: 14px; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none; }

    /* Panel Kontrol */
    #ctrlPanel {
      position: absolute; bottom: 0; left: 0; width: 100%; z-index: 50;
      background: rgba(0,0,0,0.8); padding: 10px 15px; display: flex; flex-direction: column; gap: 8px;
      box-sizing: border-box; opacity: 0; transition: opacity 0.2s;
    }
    #wrap:hover #ctrlPanel, #wrap.showCtrl #ctrlPanel { opacity: 1; }
    .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; }
    .progress-bar-inner { height: 100%; width: 100%; background: #ff0000; border-radius: 2px; }
    .controls-row { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 13px; }
    .left-controls, .right-controls { display: flex; align-items: center; gap: 15px; }
    .controls-row button { background: transparent; border: none; color: #fff; cursor: pointer; font-size: 16px; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .controls-row button:hover { color: #ccc; }
    .vol-wrap { display: flex; align-items: center; gap: 5px; }
    .vol-wrap input[type=range] { width: 70px; accent-color: #fff; cursor: pointer; }
    .time-display { font-family: monospace; font-size: 13px; }
    #exit { display: none; position: fixed; top: 10px; left: 10px; z-index: 10000; padding: 6px 10px; border: 0; border-radius: 6px; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="container"></div>
    <div id="status"></div>
    <div id="ctrlPanel">
      <div class="progress-bar"><div class="progress-bar-inner"></div></div>
      <div class="controls-row">
        <div class="left-controls">
          <button id="cPlay" title="Play / Pause">▶</button>
          <span class="time-display" id="liveTime">0:00</span>
          <span style="font-size: 11px; opacity: 0.7; margin-left: 5px;">LIVE</span>
        </div>
        <div class="right-controls">
          <div class="vol-wrap">
            <button id="cMute" title="Mute">🔇</button>
            <input id="cVol" type="range" min="0" max="100" value="80" title="Volume">
          </div>
          <button id="cFull" title="Fullscreen">⛶</button>
        </div>
      </div>
    </div>
  </div>
  <button id="exit">✕ Keluar</button>

  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script src="jessibuca.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const wrap = document.getElementById('wrap');
    const btnExit = document.getElementById('exit');
    const show = m => statusEl.textContent = m;
    window.addEventListener('error', e => show('Error: ' + e.message));
    window.addEventListener('unhandledrejection', e => show('Error: ' + (e.reason?.message || e.reason)));

    const params = new URLSearchParams(location.search);
    const target = params.get('url');
    let player;
    let audioUnlocked = false;

    // ===== Cegah layar redup / mati =====
    let wakeLock = null;
    const noSleep = window.NoSleep ? new NoSleep() : null;
    let noSleepOn = false;

    async function keepAwake() {
      if (wakeLock) return;
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          return;
        }
      } catch (e) {}
      try {
        if (noSleep && !noSleepOn) { await noSleep.enable(); noSleepOn = true; }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });
    document.addEventListener('fullscreenchange', keepAwake);
    ['click', 'touchend'].forEach(ev => document.addEventListener(ev, keepAwake, { passive: true }));
    keepAwake();

    // ===== Refit / Resize (hanya saat start & fullscreen toggle) =====
    function refit() {
      setTimeout(() => {
        try { if (player && player.resize) player.resize(); } catch (e) {}
      }, 200);
    }

    // ===== Rotated fallback =====
    function forceRotate(on) {
      wrap.classList.toggle('rotated', on);
      btnExit.style.display = on ? 'block' : 'none';
      refit();
    }

    // ===== Fullscreen toggle =====
    async function toggleFullscreen() {
      keepAwake();
      try { player && player.audioResume && player.audioResume(); } catch (e) {}

      if (document.fullscreenElement) {
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        try { await document.exitFullscreen(); } catch (e) {}
        refit();
        return;
      }
      if (wrap.classList.contains('rotated')) {
        forceRotate(false);
        return;
      }
      try {
        await wrap.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        refit();
        return;
      } catch (e) { forceRotate(true); }
    }

    btnExit.onclick = async () => {
      if (wrap.classList.contains('rotated')) { forceRotate(false); return; }
      if (document.fullscreenElement) {
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        try { await document.exitFullscreen(); } catch (e) {}
        refit();
      }
    };

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement || wrap.classList.contains('rotated');
      btnExit.style.display = isFs ? 'block' : 'none';
      if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }
      refit();
    });

    // ===== Tombol Kontrol =====
    const cPlay = document.getElementById('cPlay');
    const cMute = document.getElementById('cMute');
    const cVol  = document.getElementById('cVol');
    const cFull = document.getElementById('cFull');
    const liveTime = document.getElementById('liveTime');

    let playing = true;
    let muted = false;
    let lastVol = 80;

    // ===== AUDIO UNLOCK =====
    function unlockAudio() {
      if (audioUnlocked) return;
      try {
        if (player) {
          player.cancelMute && player.cancelMute();
          player.audioResume && player.audioResume();
          player.setVolume && player.setVolume(lastVol / 100);
        }
        audioUnlocked = true;
        cMute.textContent = '🔊';
      } catch (e) {}
    }

    wrap.addEventListener('click', unlockAudio);
    wrap.addEventListener('touchstart', unlockAudio, { passive: true });
    document.body.addEventListener('click', unlockAudio, { once: true });
    document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

    cPlay.onclick = () => {
      try {
        if (playing) {
          player && player.pause && player.pause();
          cPlay.textContent = '▶';
          playing = false;
        } else {
          player && player.play && player.play();
          cPlay.textContent = '⏸';
          playing = true;
          unlockAudio();
        }
      } catch (e) {}
    };

    cMute.onclick = () => {
      try {
        muted = !muted;
        if (muted) {
          lastVol = +cVol.value || 80;
          cVol.value = 0;
          player && player.setVolume && player.setVolume(0);
          cMute.textContent = '🔇';
        } else {
          cVol.value = lastVol;
          player && player.cancelMute && player.cancelMute();
          player && player.audioResume && player.audioResume();
          player && player.setVolume && player.setVolume(lastVol / 100);
          cMute.textContent = '🔊';
        }
      } catch (e) {}
    };

    cVol.oninput = () => {
      try {
        const v = +cVol.value;
        player && player.setVolume && player.setVolume(v / 100);
        if (v > 0) {
          muted = false;
          cMute.textContent = '🔊';
          player && player.cancelMute && player.cancelMute();
          player && player.audioResume && player.audioResume();
        } else {
          muted = true;
          cMute.textContent = '🔇';
        }
      } catch (e) {}
    };

    cFull.onclick = toggleFullscreen;

    wrap.addEventListener('touchstart', () => {
      wrap.classList.add('showCtrl');
      clearTimeout(wrap._ctrlTimer);
      wrap._ctrlTimer = setTimeout(() => wrap.classList.remove('showCtrl'), 3000);
    }, { passive: true });

    // ===== Player Jessibuca (stabil + teroptimasi) =====
    function pickUrl(j) {
      if (typeof j === 'string') return j;
      return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
    }

    function play(url) {
      show('');
      if (player) player.destroy();

      player = new Jessibuca({
        container: document.getElementById('container'),
        
        // --- Konfigurasi stabil (soft-decode) ---
        videoBuffer: 10,          // buffer besar, toleran jitter
        isResize: true,           // biarkan Jessibuca menyesuaikan ukuran
        isFullResize: false,      // jangan paksa render full
        useMSE: false,            // soft-decode (paling kompatibel FLV)
        useWCS: false,
        forceNoOffscreen: false,  // default, paling stabil
        
        // Audio
        hasAudio: true,
        isNotMute: true,
        
        // UI
        showBandwidth: false,
        text: '',
        loadingText: 'Memuat...',
        operateBtns: { fullscreen: false, screenshot: false, play: false, audio: false }
      });

      player.on('error', e => show('Stream error: ' + e));

      player.on('start', () => {
        refit();
        keepAwake();
        playing = true;
        cPlay.textContent = '⏸';

        // Debug state audio
        try {
          console.log('[Jessibuca] isMute:', player.isMute && player.isMute());
          console.log('[Jessibuca] volume:', player.getVolume && player.getVolume());
        } catch (e) {}

        try { player.setVolume && player.setVolume(lastVol / 100); } catch (e) {}
      });

      player.play(url);
    }

    let secondsElapsed = 0;
    setInterval(() => {
      if (playing && player) {
        secondsElapsed++;
        const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const s = (secondsElapsed % 60).toString().padStart(2, '0');
        liveTime.textContent = `${m}:${s}`;
      }
    }, 1000);

    async function start() {
      if (!window.Jessibuca) return show('jessibuca.js tidak ditemukan');
      if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');

      show('Loading...');
      const ctrl = new AbortController();
      const res = await fetch(target, { signal: ctrl.signal });
      const type = res.headers.get('content-type') || '';

      if (type.includes('json')) {
        const j = await res.json();
        if (j?.live === false) return show('Room offline / tidak ditemukan');
        const flv = pickUrl(j);
        if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
        play(flv);
      } else if (type.includes('text/')) {
        const t = (await res.text()).trim();
        if (/^https?:\/\//.test(t)) play(t);
        else show('Respons tidak dikenali: ' + t.slice(0, 150));
      } else {
        ctrl.abort();
        play(target);
      }
    }
    start();
  </script>
</body>
</html>
