<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexyz</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
    }
    #wrap:fullscreen {
      aspect-ratio: auto;
      width: 100%;
      height: 100%;
    }
    #wrap.rotated {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      aspect-ratio: auto;
      transform-origin: top left;
      transform: translateX(100vw) rotate(90deg);
      z-index: 9999;
    }
    #bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
    }
    #btnLand {
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: #2a7fff;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      font-size: 13px;
      word-break: break-all;
    }
    #exit {
      display: none;
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 10000;
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      cursor: pointer;
    }
  </style>
  <script src="jessibuca.js"></script>
</head>
<body>
  <div id="wrap"><div id="container"></div></div>
  <button id="exit">✕ Keluar</button>
  <div id="bar">
    <button id="btnLand">Landscape</button>
    <span id="status"></span>
  </div>

  <script>
    (() => {
      const statusEl = document.getElementById('status');
      const wrap = document.getElementById('wrap');
      const container = document.getElementById('container');
      const btnExit = document.getElementById('exit');
      const params = new URLSearchParams(location.search);
      const target = params.get('url');

      let player = null;
      let wakeLock = null;
      let refitRaf = 0;

      const show = m => { statusEl.textContent = m; };

      window.addEventListener('error', e => show('Error: ' + e.message));
      window.addEventListener('unhandledrejection', e => {
        show('Error: ' + (e.reason?.message || e.reason));
      });

      // ===== Cegah layar redup / mati =====
      async function keepAwake() {
        if (wakeLock || !('wakeLock' in navigator)) return;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
        } catch (_) {}
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') keepAwake();
      });
      ['click', 'touchend'].forEach(ev => {
        document.addEventListener(ev, keepAwake, { passive: true });
      });
      keepAwake();

      // ===== Landscape & Fit =====
      function refit() {
        cancelAnimationFrame(refitRaf);
        refitRaf = requestAnimationFrame(() => {
          if (!player) return;
          try { player.resize && player.resize(); } catch (_) {}
          try { player.setScaleMode && player.setScaleMode(0); } catch (_) {}
        });
      }

      function forceRotate(on) {
        wrap.classList.toggle('rotated', on);
        btnExit.style.display = on ? 'block' : 'none';
        refit();
      }

      document.getElementById('btnLand').onclick = async () => {
        keepAwake();
        try { player && player.audioResume && player.audioResume(); } catch (_) {}
        try {
          await wrap.requestFullscreen();
          if (screen.orientation?.lock) {
            await screen.orientation.lock('landscape');
          }
          refit();
          return;
        } catch (_) {}
        forceRotate(true);
      };

      btnExit.onclick = () => forceRotate(false);

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && screen.orientation?.unlock) {
          try { screen.orientation.unlock(); } catch (_) {}
        }
        refit();
      });
      window.addEventListener('resize', refit);

      // ===== Deteksi Otomatis WebCodecs (useWCS) =====
      function canUseWCS() {
        return Boolean(
          window.isSecureContext &&
          typeof window.VideoDecoder === 'function'
        );
      }

      // ===== Player (Ringan, Anti Slow-Mo, Auto useWCS) =====
      function pickUrl(j) {
        if (typeof j === 'string') return j.trim();
        return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
      }

      function play(url, forceDisableWcs = false) {
        show('');
        if (player) {
          try { player.destroy(); } catch (_) {}
          player = null;
        }

        const useWCS = forceDisableWcs ? false : canUseWCS();

        player = new Jessibuca({
          container,
          videoBuffer: 0.2,
          isResize: false,
          isFullResize: false,
          useMSE: false,
          useWCS,
          text: '',
          loadingText: 'Memuat...',
          showBandwidth: false,
          forceNoOffscreen: true,
          isNotMute: false,
          operateBtns: {
            fullscreen: false,
            screenshot: true,
            play: true,
            audio: true
          }
        });

        player.on('error', e => {
          if (useWCS && !forceDisableWcs) {
            play(url, true);
            return;
          }
          show('Stream error: ' + e);
        });

        player.on('start', () => {
          refit();
          keepAwake();
        });

        player.play(url);
      }

      async function start() {
        if (!window.Jessibuca) return show('jessibuca.js tidak ditemukan');
        if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');

        show('Loading...');
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);

        try {
          const res = await fetch(target, {
            signal: ctrl.signal,
            redirect: 'follow'
          });
          clearTimeout(timer);

          const type = (res.headers.get('content-type') || '').toLowerCase();

          if (type.includes('application/json') || type.includes('+json')) {
            const j = await res.json();
            if (j?.live === false) return show('Room offline / tidak ditemukan');
            const flv = pickUrl(j);
            if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
            play(flv);
            return;
          }

          if (type.startsWith('text/')) {
            const t = (await res.text()).trim();
            if (/^https?:\/\//.test(t)) {
              play(t);
            } else {
              show('Respons tidak dikenali: ' + t.slice(0, 150));
            }
            return;
          }

          if (res.url && res.url !== target) {
            play(res.url);
            return;
          }

          play(target);
        } catch (_) {
          clearTimeout(timer);
          play(target);
        }
      }

      window.addEventListener('beforeunload', () => {
        cancelAnimationFrame(refitRaf);
        try { player && player.destroy(); } catch (_) {}
      });

      start();
    })();
  </script>
</body>
</html>
