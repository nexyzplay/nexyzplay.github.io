<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightweight FLV Player (Jessibuca)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #player {
      width: 100vw;
      height: 100vh;
    }
    #status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      padding: 6px 10px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 4px;
      pointer-events: none;
      max-width: calc(100vw - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hidden { display: none !important; }
  </style>
  <!-- Load Jessibuca dari CDN resmi / jsDelivr (sesuaikan versi/path repo GitHub jika di-host sendiri) -->
  <script src="https://cdn.jsdelivr.net/npm/jessibuca@latest/dist/jessibuca.js"></script>
</head>
<body>
  <div id="status">Memuat...</div>
  <div id="player"></div>

  <script>
    (function () {
      const statusEl = document.getElementById("status");
      const containerEl = document.getElementById("player");

      const setStatus = (msg, autoHideMs = 0) => {
        statusEl.textContent = msg;
        statusEl.classList.remove("hidden");
        if (autoHideMs > 0) {
          clearTimeout(setStatus._t);
          setStatus._t = setTimeout(() => statusEl.classList.add("hidden"), autoHideMs);
        }
      };

      const params = new URLSearchParams(window.location.search);
      const rawUrl = params.get("url");

      if (!rawUrl) {
        setStatus("Parameter ?url= kosong. Contoh: ?url=https://contoh.com/live.flv");
        return;
      }

      // Mengurai redirect jika endpoint mengembalikan response teks/JSON/redirect URL,
      // lalu tetap fallback ke URL asli agar Jessibuca menanganinya langsung jika CORS memblokir fetch.
      async function resolveStreamUrl(targetUrl) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 4000);

          const res = await fetch(targetUrl, {
            method: "GET",
            redirect: "follow",
            signal: controller.signal
          });
          clearTimeout(timer);

          // Jika fetch mengikuti redirect ke URL akhir yang berbeda
          if (res.url && res.url !== targetUrl) {
            return res.url;
          }

          const contentType = (res.headers.get("content-type") || "").toLowerCase();
          if (contentType.includes("application/json")) {
            const data = await res.json();
            const found = data.url || data.stream || data.playUrl || data.data?.url;
            if (typeof found === "string" && found.startsWith("http")) {
              return found;
            }
          } else if (contentType.includes("text/plain") || contentType.includes("text/uri-list")) {
            const text = (await res.text()).trim();
            if (text.startsWith("http")) {
              return text;
            }
          }
        } catch (_) {
          // Abaikan error fetch (misalnya CORS atau stream langsung) dan biarkan Jessibuca memproses rawUrl
        }
        return targetUrl;
      }

      // Konfigurasi ringan & minim delay untuk mencegah slow-motion
      const jessibuca = new Jessibuca({
        container: containerEl,
        videoBuffer: 0.2,        // Buffer kecil (detik) agar tidak menumpuk & slow-mo
        isResize: false,         // Hindari kalkulasi resize berlebih saat playback
        useWCS: true,            // Gunakan WebCodecs jika tersedia (lebih ringan dari software decode)
        useMSE: false,           // Matikan MSE jika ingin kontrol buffer ketat untuk FLV
        hasAudio: true,
        hasVideo: true,
        operateBtns: {
          fullscreen: true,
          screenshot: false,
          play: true,
          audio: true,
          record: false
        },
        forceNoOffscreen: false,
        hiddenAutoPause: false,
        debug: false
      });

      jessibuca.on("load", () => setStatus("Stream dimuat..."));
      jessibuca.on("start", () => setStatus("Memutar", 2000));
      jessibuca.on("error", (err) => setStatus("Error: " + (err || "Gagal memutar stream")));
      jessibuca.on("timeout", () => setStatus("Koneksi timeout"));

      // Bersihkan resource saat tab/halaman ditutup
      window.addEventListener("beforeunload", () => {
        try { jessibuca.destroy(); } catch (_) {}
      });

      resolveStreamUrl(rawUrl).then((finalUrl) => {
        setStatus("Menghubungkan ke stream...");
        const playPromise = jessibuca.play(finalUrl);
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(() => {
            // Jika autoplay diblokir browser, coba play lagi saat user klik layar
            setStatus("Klik layar untuk mulai memutar");
            containerEl.addEventListener("click", () => {
              jessibuca.play(finalUrl);
            }, { once: true });
          });
        }
      });
    })();
  </script>
</body>
</html>
