<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexyz</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; }
    #wrap { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; overflow: hidden; }
    #container { width: 100%; height: 100%; }

    /* Fullscreen asli */
    #wrap:fullscreen { aspect-ratio: auto; width: 100%; height: 100%; }

    /* Putar paksa (fallback iPhone) */
    #wrap.rotated {
      position: fixed; top: 0; left: 0;
      width: 100vh; height: 100vw; aspect-ratio: auto;
      transform-origin: top left;
      transform: translateX(100vw) rotate(90deg);
      z-index: 9999;
    }

    #bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
    #bar button { padding: 6px 12px; border: 0; border-radius: 6px; background: #2a7fff; color: #fff; font-size: 14px; }
    #status { font-size: 13px; word-break: break-all; }
    #exit {
      display: none; position: fixed; top: 8px; left: 8px; z-index: 10000;
      padding: 6px 10px; border: 0; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff;
    }

    /* ===== Panel kontrol tunggal (gabungan semua tombol) ===== */
    #ctrlPanel {
      position: absolute; right: 10px; bottom: 10px; z-index: 50;
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,.55); border-radius: 10px;
      padding: 6px 8px; backdrop-filter: blur(4px);
      opacity: 0; transition: opacity .25s;
    }
    #wrap:hover #ctrlPanel,
    #wrap.showCtrl #ctrlPanel { opacity: 1; }
    #ctrlPanel button {
      width: 34px; height: 34px; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.12); color: #fff; font-size: 15px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #ctrlPanel button:hover { background: rgba(255,255,255,.25); }
    #ctrlPanel button:active { background: rgba(255,255,255,.35); }
    #ctrlPanel .volWrap { display: flex; align-items: center; gap: 4px; }
    #ctrlPanel input[type=range] {
      width: 0; opacity: 0; transition: width .2s, opacity .2s;
      accent-color: #2a7fff;
    }
    #ctrlPanel .volWrap:hover input[type=range],
    #ctrlPanel .volWrap:focus-within input[type=range] {
      width: 80px; opacity: 1;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="container"></div>

    <!-- ===== Satu panel kontrol: play, volume, screenshot, fullscreen ===== -->
    <div id="ctrlPanel">
      <button id="cPlay" title="Putar / Jeda">▶</button>
      <div class="volWrap">
        <button id="cMute" title="Mute / Unmute">🔇</button>
        <input id="cVol" type="range" min="0" max="100" value="80" title="Volume">
      </div>
      <button id="cShot" title="Screenshot">📷</button>
      <button id="cFull" title="Fullscreen / Landscape">⛶</button>
    </div>
  </div>

  <button id="exit">✕ Keluar</button>
  <div id="bar">
    <button id="btnLand">Landscape</button>
    <span id="status"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
  <script src="jessibuca.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const wrap = document.getElementById('wrap');
    const btnExit = document.getElementById('exit');
    const show = m => statusEl.textContent = m;
    window.addEventListener('error', e => show('Error: ' + e.message));
    window.addEventListener('unhandledrejection', e => show('Error: ' + (e.reason?.message || e.reason)));

    const params = new URLSearchParams(location.search);
    const target = params.get('url');
    let player;

    // ===== Cegah layar redup / mati =====
    let wakeLock = null;
    const noSleep = window.NoSleep ? new NoSleep() : null;
    let noSleepOn = false;

    async function keepAwake() {
      if (wakeLock) return;
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          return;
        }
      } catch (e) { /* ditolak, coba cadangan */ }
      try {
        if (noSleep && !noSleepOn) { await noSleep.enable(); noSleepOn = true; }
      } catch (e) { /* butuh sentuhan pengguna dulu */ }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') keepAwake();
    });
    document.addEventListener('fullscreenchange', keepAwake);
    ['click', 'touchend'].forEach(ev => document.addEventListener(ev, keepAwake, { passive: true }));
    keepAwake();

    // ===== Landscape =====
    function refit() {
      setTimeout(() => {
        try { player && player.resize && player.resize(); } catch (e) {}
        try { player && player.setScaleMode(0); } catch (e) {} // 0 = tampil utuh, tanpa crop
      }, 150);
    }

    function forceRotate(on) {
      wrap.classList.toggle('rotated', on);
      btnExit.style.display = on ? 'block' : 'none';
      refit();
    }

    async function goLandscape() {
      keepAwake();
      try { player && player.audioResume && player.audioResume(); } catch (e) {}
      try {
        await wrap.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
        refit();
        return;
      } catch (e) { /* tidak didukung, pakai putar CSS */ }
      forceRotate(true);
    }

    document.getElementById('btnLand').onclick = goLandscape;
    btnExit.onclick = () => forceRotate(false);

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
      refit();
    });
    window.addEventListener('resize', refit);

    // ===== Tombol panel kontrol =====
    const cPlay = document.getElementById('cPlay');
    const cMute = document.getElementById('cMute');
    const cVol  = document.getElementById('cVol');
    const cShot = document.getElementById('cShot');
    const cFull = document.getElementById('cFull');

    let playing = true;
    let muted = false;
    let lastVol = 80;

    // play / pause
    cPlay.onclick = () => {
      try {
        if (playing) { player && player.pause && player.pause(); cPlay.textContent = '▶'; }
        else { player && player.play && player.play(); cPlay.textContent = '⏸'; }
        playing = !playing;
      } catch (e) {}
    };

    // mute
    cMute.onclick = () => {
      try {
        muted = !muted;
        if (muted) {
          lastVol = +cVol.value;
          cVol.value = 0;
          player && player.setVolume && player.setVolume(0);
          cMute.textContent = '🔇';
        } else {
          cVol.value = lastVol;
          player && player.setVolume && player.setVolume(lastVol / 100);
          cMute.textContent = '🔊';
        }
      } catch (e) {}
    };

    // volume slider
    cVol.oninput = () => {
      try {
        const v = +cVol.value;
        player && player.setVolume && player.setVolume(v / 100);
        if (v > 0) { muted = false; cMute.textContent = '🔊'; }
        else { muted = true; cMute.textContent = '🔇'; }
      } catch (e) {}
    };

    // screenshot
    cShot.onclick = () => {
      try { player && player.screenshot && player.screenshot(); } catch (e) {}
    };

    // fullscreen / landscape (sama seperti tombol Landscape)
    cFull.onclick = goLandscape;

    // tampilkan panel saat disentuh (untuk mobile)
    wrap.addEventListener('touchstart', () => {
      wrap.classList.add('showCtrl');
      clearTimeout(wrap._ctrlTimer);
      wrap._ctrlTimer = setTimeout(() => wrap.classList.remove('showCtrl'), 3000);
    }, { passive: true });

    // ===== Player =====
    function pickUrl(j) {
      if (typeof j === 'string') return j;
      return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
    }

    function play(url) {
      show('');
      if (player) player.destroy();
      player = new Jessibuca({
        container: document.getElementById('container'),
        videoBuffer: 1,
        isResize: true,
        isFullResize: false,
        useMSE: false,
        text: '',
        loadingText: 'Memuat...',
        showBandwidth: false,    // stats kecepatan internet dimatikan
        forceNoOffscreen: true,
        isNotMute: false,
        // Panel bawaan Jessibuca dimatikan semua — kita pakai panel sendiri
        operateBtns: { fullscreen: false, screenshot: false, play: false, audio: false }
      });
      player.on('error', e => show('Stream error: ' + e));
      player.on('start', () => {
        refit();
        keepAwake();
        playing = true;
        cPlay.textContent = '⏸';
        try { player.setVolume && player.setVolume(cVol.value / 100); } catch (e) {}
      });
      player.play(url);
    }

    async function start() {
      if (!window.Jessibuca) return show('jessibuca.js tidak ditemukan');
      if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');

      show('Loading...');
      const ctrl = new AbortController();
      const res = await fetch(target, { signal: ctrl.signal });
      const type = res.headers.get('content-type') || '';

      if (type.includes('json')) {
        const j = await res.json();
        if (j?.live === false) return show('Room offline / tidak ditemukan');
        const flv = pickUrl(j);
        if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
        play(flv);
      } else if (type.includes('text/')) {
        const t = (await res.text()).trim();
        if (/^https?:\/\//.test(t)) play(t);
        else show('Respons tidak dikenali: ' + t.slice(0, 150));
      } else {
        ctrl.abort();
        play(target);
      }
    }
    start();
  </script>
</body>
</html>
