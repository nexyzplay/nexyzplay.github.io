<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huya Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.css">
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    #player { width: 100%; }
    #status { padding: 8px 12px; margin: 0; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="player"></div>
  <p id="status"></p>

  <script src="https://cdn.jsdelivr.net/npm/xgplayer@3.0.20/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xgplayer-flv@3.0.20/dist/index.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const show = m => statusEl.textContent = m;

    // Tampilkan error JS apa pun di halaman
    window.addEventListener('error', e => show('Error: ' + e.message));
    window.addEventListener('unhandledrejection', e => show('Error: ' + (e.reason?.message || e.reason)));

    // Nama global plugin bisa FlvPlayer atau FlvPlugin
    const Flv = window.FlvPlayer || window.FlvPlugin;
    const PlayerCls = window.Player;

    const params = new URLSearchParams(location.search);
    let target = params.get('url');
    let id = params.get('id');

    // Nilai url bisa sudah memuat ?id=... di dalamnya
    if (target) {
      try {
        const u = new URL(target);
        if (!id) id = u.searchParams.get('id');
        else if (!u.searchParams.has('id')) {
          u.searchParams.set('id', id);
          target = u.toString();
        }
      } catch (e) { show('Parameter url tidak valid'); }
    }

    function play(url) {
      show('');
      new PlayerCls({
        id: 'player',
        url,
        isLive: true,
        autoplay: true,
        autoplayMuted: true,
        width: '100%',
        height: Math.round(window.innerHeight * 0.85),
        plugins: [Flv]
      });
    }

    // Cari link FLV di dalam JSON (beberapa bentuk umum)
    function pickUrl(j) {
      if (typeof j === 'string') return j;
      return j?.url || j?.flv || j?.data?.url || j?.data?.flv || null;
    }

    async function start() {
      if (!PlayerCls) return show('xgplayer gagal dimuat (cek koneksi / adblock / CDN)');
      if (!Flv) return show('Plugin FLV gagal dimuat (cek koneksi / adblock / CDN)');
      if (!target) return show('Pakai: ?url=ENDPOINT/?id=ROOM_ID');
      if (!Flv.isSupported()) return show('Browser tidak mendukung FLV (MSE)');

      show('Mengambil stream...');
      const ctrl = new AbortController();
      const res = await fetch(target, { signal: ctrl.signal });
      const type = res.headers.get('content-type') || '';

      if (type.includes('json')) {
        const j = await res.json();
        if (j?.live === false) return show('Room offline / tidak ditemukan');
        const flv = pickUrl(j);
        if (!flv) return show('JSON tidak berisi link FLV: ' + JSON.stringify(j).slice(0, 150));
        play(flv);
      } else if (type.includes('text/')) {
        const t = (await res.text()).trim();
        if (/^https?:\/\//.test(t)) play(t);
        else show('Respons tidak dikenali: ' + t.slice(0, 150));
      } else {
        // Endpoint kemungkinan langsung mengalirkan FLV
        ctrl.abort();
        play(target);
      }
    }
    start();
  </script>
</body>
</html>
